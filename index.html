<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WACKEL-BEANS: DER DEUTSCH-RUN</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- Part 0151-0180 Loading Overlay Screen -->
    <div id="loading-screen" class="loading-overlay">
      <div class="loading-content">
        <div class="loading-badge">🎮 A0 DEUTSCH-RUN</div>
        <h1 class="loading-logo">WACKEL-BEANS</h1>
        <p class="loading-sub">Lerne Deutsch im Fall-Guys-Style!</p>
        <div class="progress-bar-container">
          <div id="loading-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div id="loading-text" class="loading-text">Loading... 0%</div>
      </div>
    </div>

    <!-- Interactive Character Customization HUD -->
    <div id="character-hud" class="character-hud">
      <div class="hud-header">
        <span class="hud-badge">✨ COLOR PALETTES</span>
        <span class="hud-label">اختيار الألوان والستايل / Character Skins</span>
      </div>
      <div class="hud-buttons">
        <button class="skin-btn active" data-skin="OFFICER">👮 1: الضابط (Navy/White)</button>
        <button class="skin-btn" data-skin="MOL_FOQIYA">👳 2: مول الفوقية (Ivory/Tan)</button>
        <button class="skin-btn" data-skin="CLASSIC">🫘 3: كلاسيك (Gold/Red)</button>
        <button class="skin-btn" data-skin="KREUZBERG">🟢 4: كروزبيرغ (Black/Green)</button>
        <button class="skin-btn" data-skin="SAKURA">🌸 5: ساكورا (Pink/Cyan)</button>
        <button class="skin-btn" data-skin="SPÄTI">🌊 6: سباتي (White/Cyan)</button>
        <button class="skin-btn" data-skin="U-BAHN">🚇 7: يو-بان (Slate/Yellow)</button>
        <button class="skin-btn" data-skin="CYBERPUNK">⚡ 8: سايبربانك (Violet/Lime)</button>
        <button class="skin-btn" data-skin="BERGHAIN">🌃 9: بيرغهاين (Jet-Black)</button>
        <button class="skin-btn" data-skin="SUNSET">🍊 0: غروب (Orange/Indigo)</button>
      </div>
      <div class="hud-hint">
        🎮 <b>WASD / Arrows</b>: للتحرك | <b>Space</b>: للقفز | الأرقام <b>0 - 9</b> أو <b>C</b> لتبديل الألوان
      </div>
    </div>

    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
